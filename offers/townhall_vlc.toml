# Offers of the Ajuntament de València connector.
# The class says which rulebook terms apply; see classes/<class>.md.
# Categories checked on opendata.vlci.valencia.es on 2026-11-11 (rulebook §6):
# traffic and air quality are open (CC BY 4.0); container fill levels are not.

[provider]
id = "townhall_vlc"
host = "townhall-vlc.citcom-vrain-dataspace.eu"

[[offer]]
name = "waste-containers"
class = "dataset-access"
path = "/lepus/ngsi-ld"
entity_type = "WasteContainer"
credential = "MachineCredential"
role = "clearence1"

[[offer]]
name = "air-quality"
class = "open-data"
path = "/lepus/ngsi-ld"
entity_type = "AirQualityObserved"
credential = "MachineCredential"
role = "clearence1"

[[offer]]
name = "traffic-flow"
class = "open-data"
path = "/lepus/ngsi-ld"
entity_type = "TrafficFlowObserved"
credential = "MachineCredential"
role = "clearence1"

[[offer]]
name = "traffic-state"
class = "open-data"
path = "/ngsi-ld"
entity_type = "TrafficState"
credential = "MachineCredential"
role = "clearence1"
