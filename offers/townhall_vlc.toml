# Offers of the Ajuntament de València connector.
# The class says which rulebook terms apply; see classes/<class>.md.
# Category by source (rulebook R6.4, provisional): public endpoint -> open-data;
# VLCi platform through Lepus (/lepus/ngsi-ld) -> dataset-access (within the DS only).

[provider]
id = "townhall_vlc"
host = "townhall-vlc.citcom-vrain-dataspace.eu"

# Values for the terms templates (classes/<class>.terms.md); an offer can override
# any of them in its own [offer.terms].
[provider.terms]
provider_name = "Ajuntament de València"
load_targets = "the Service or the VLCi platform"
origin = 'The data comes from the **Ajuntament de València** (City Council of Valencia). When using or disseminating it, the source must be cited: *"Source: Ajuntament de València (VLCi)"*. The Provider transforms the data into the NGSI-LD format but does not modify the values.'
quality = 'The data comes from municipal sensors and systems. It may contain errors, gaps or values that have not been validated. The Service is provided "as is", without any warranty of accuracy, completeness or fitness for a particular purpose. **It does not replace the official notices and information of the Ajuntament.**'
data_protection_law = "the GDPR and Spanish Organic Law 3/2018"
licence_note = ""
governing_law = "Spanish law"
courts = "the courts of the city of Valencia"

[[offer]]
name = "waste-containers"
class = "dataset-access"
path = "/lepus/ngsi-ld"
entity_type = "WasteContainer"
credential = "MachineCredential"
role = "clearence1"

[[offer]]
name = "air-quality"
class = "dataset-access"
path = "/lepus/ngsi-ld"
entity_type = "AirQualityObserved"
credential = "MachineCredential"
role = "clearence1"

# Road sections of VLCi (through Lepus) and measurement points of the geoportal
# (open data, loaded into Orion-LD by Airflow): one dataset, two backends.
[[offer]]
name = "traffic-flow"
class = "dataset-access"
path = ["/lepus/ngsi-ld", "/ngsi-ld"]
entity_type = "TrafficFlowObserved"
credential = "MachineCredential"
role = "clearence1"

[[offer]]
name = "traffic-state"
class = "open-data"
path = "/ngsi-ld"
entity_type = "TrafficState"
credential = "MachineCredential"
role = "clearence1"

[offer.terms]
source_publisher = "the Ajuntament de València on its open data portal"
licence = "Creative Commons Attribution 4.0 International (CC BY 4.0)"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source_url = "https://opendata.vlci.valencia.es/dataset/estat-transit-temps-real"

[[offer]]
name = "points-of-interest"
class = "open-data"
path = "/ngsi-ld"
entity_type = "PointOfInterest"
credential = "MachineCredential"
role = "clearence1"

[offer.terms]
source_publisher = "VRAIN (Universitat Politècnica de València)"
licence = "Open Database License (ODbL) 1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
source_url = "https://github.com/CitComAI-Hub/tourism-recommender"
licence_note = " The catalog is a database derived from OpenStreetMap: an adapted database that is made public must also be shared under the ODbL. The descriptions taken from Wikipedia are under CC BY-SA 4.0 and must be shared alike; each image is under the licence of its own file."
origin = 'The places come from **OpenStreetMap** (© OpenStreetMap contributors, ODbL), **Wikidata** (CC0), **Wikipedia** (CC BY-SA), **Wikimedia Commons** (each image under its own licence) and the *Inventario General del Patrimonio Cultural Valenciano* of the **Generalitat Valenciana** (CC BY 4.0); each place names its sources in its `dataProvider` attribute. When using or disseminating the data, cite: *"Points of interest of Valencia, VRAIN - Universitat Politècnica de València; data © OpenStreetMap contributors, Wikidata, Wikipedia and Generalitat Valenciana"*.'
quality = 'The catalog was reviewed by sampling, not place by place. Visit durations are estimates (marked as such), opening hours are only those published in OpenStreetMap, some descriptions are generated from structured data (marked as such), and the open sources may contain errors or gaps. The data is provided "as is", without any warranty of accuracy, completeness or fitness for a particular purpose.'

# Traffic signal controllers (geoportal, open data), loaded into Orion-LD by
# Airflow as Smart Data Models Device: there is no SDM for traffic signals. The
# policy covers every Device of the provider's Orion-LD, which holds only these.
[[offer]]
name = "traffic-signals"
class = "open-data"
path = "/ngsi-ld"
entity_type = "Device"
credential = "MachineCredential"
role = "clearence1"

[offer.terms]
source_publisher = "the Ajuntament de València on its open data portal"
licence = "Creative Commons Attribution 4.0 International (CC BY 4.0)"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source_url = "https://opendata.vlci.valencia.es/dataset/reguladors-grups-semaforics-reguladores-grupos-semaforicos"
