name: policies

# The generator works and the Rego that odrl-pap generates from every offer
# decides as each class says.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    name: generator + opa test of every class
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Offers are valid and build
        run: python -m rulebook_gen build --out build
      - name: opa test (odrl-pap 1.4.10, OPA 1.11.0)
        run: tests/opa/run.sh
