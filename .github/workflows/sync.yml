name: in sync with deployment

# What dataspace-on-upv deploys (offers, terms, rate limits) is what this
# repository generates. dataspace-on-upv changes do not trigger this repo:
# re-checked daily.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: dataspace-on-upv uses the generated policies
    runs-on: ubuntu-24.04
    env:
      DS_DEPLOY_KEY: ${{ secrets.DS_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Pull requests from forks get no secrets: skip there. Anywhere else a
      # missing key fails, so the badge never shows green without a check.
      - name: Access to dataspace-on-upv
        if: env.DS_DEPLOY_KEY == ''
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "::warning::secret DS_DEPLOY_KEY not available, sync not checked"
          else
            echo "::error::secret DS_DEPLOY_KEY not set (read-only deploy key of CitComAI-Hub/dataspace-on-upv)"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: env.DS_DEPLOY_KEY != ''
        with:
          repository: CitComAI-Hub/dataspace-on-upv
          ref: main
          ssh-key: ${{ secrets.DS_DEPLOY_KEY }}
          path: dataspace-on-upv
          sparse-checkout: providers
      - uses: actions/setup-python@v5
        if: env.DS_DEPLOY_KEY != ''
        with:
          python-version: "3.12"
      - name: rulebook_gen check
        if: env.DS_DEPLOY_KEY != ''
        run: python -m rulebook_gen check --ds-repo dataspace-on-upv
