name: service image

# ghcr.io/citcomai-hub/citcom-ds-rulebook-service:<commit> for every commit of main,
# after the tests pass. The deployment pins the same commit as providers/RULEBOOK_REF.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: test, build and publish the rulebook service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: RULEBOOK_REF=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/citcomai-hub/citcom-ds-rulebook-service:${{ github.sha }}
            ghcr.io/citcomai-hub/citcom-ds-rulebook-service:main
